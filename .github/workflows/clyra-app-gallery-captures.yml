name: Clyra source app screenshot enrichment

on:
  push:
    branches: [vibe-coder-polish-and-templates]
    paths:
      - "tools/collect-upstream-app-screenshots.py"
      - ".github/workflows/clyra-app-gallery-captures.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clyra-real-app-gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow for genuine upstream image verification
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"
      - name: Inspect app authors' README images and capture only genuine missing views
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/collect-upstream-app-screenshots.py
      - name: Commit verified captures and coverage audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/library-shots/app-*-source-*.jpg lib/clyra-code/library/upstream-app-screenshots.ts app-screenshot-coverage.json
          if git diff --cached --quiet; then
            echo "All available original screenshots already saved"
            exit 0
          fi
          git commit -m "assets(gallery): append authentic upstream screenshots for source apps, keep originals"
          git push origin "HEAD:${{ github.ref_name }}"
      - name: Publish screenshot coverage and unresolved gaps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clyra-source-gallery-coverage
          path: app-screenshot-coverage.json
          if-no-files-found: warn
          retention-days: 30
