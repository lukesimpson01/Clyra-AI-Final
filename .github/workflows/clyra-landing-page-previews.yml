name: Clyra landing page previews

on:
  push:
    branches: [vibe-coder-polish-and-templates]
    paths:
      - "lib/clyra-code/library/landing-pages.ts"
      - "tools/capture-landing-page-screenshots.py"
      - ".github/workflows/clyra-landing-page-previews.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clyra-landing-captures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline image resize dependency
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"
      - name: Verify 75 independent upstream screenshots and create optimised thumbnails
        run: python tools/capture-landing-page-screenshots.py
      - name: Verify exactly 75 nonempty image assets
        run: |
          count=$(find public/library-shots -maxdepth 1 -type f -name 'landing-*.jpg' | wc -l)
          test "$count" -eq 75
          echo "PASS: $count original-upstream screenshots available locally"
      - name: Commit verified thumbnail assets to the existing working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/library-shots/landing-*.jpg
          if git diff --cached --quiet; then
            echo "All genuine screenshots already committed"
            exit 0
          fi
          git commit -m "assets(landing-pages): vendor 75 verified upstream template screenshots"
          git push origin "HEAD:${{ github.ref_name }}"
