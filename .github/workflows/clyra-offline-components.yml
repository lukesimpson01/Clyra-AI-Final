name: Clyra offline component library

on:
  push:
    branches: [main]
    paths:
      - "lib/clyra-code/offline-component-library.ts"
      - "src/components/clyra-code/ComponentLibraryPanel.tsx"
      - "lib/clyra-code/component-frames.ts"
      - "lib/clyra-code/component-demos/**"
      - "lib/clyra-code/component-shims/**"
      - "src/components/clyra-code/api.ts"
      - "src/components/clyra-code/ClyraCodeWorkspace.tsx"
      - "tools/component-library-unit-tests.ts"
      - ".gitmodules"
      - "package.json"
      - ".github/workflows/clyra-offline-components.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-source-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Clone the shadcn/ui and 21st source libraries
        run: npm run setup:component-sources
      - name: Component catalogue, live previews and add tests
        run: npm run test:component-library
      - name: React typecheck
        run: npm run lint
      - name: Web and server production build
        run: npm run build
      - name: Verify cloned libraries and licences
        run: |
          test -f external/shadcn-library/apps/v4/registry/new-york-v4/ui/button.tsx
          test -f external/shadcn-library/LICENSE.md
          test -f external/21st-library/LICENSE
          test -d external/21st-library/apps/web/components/ui
