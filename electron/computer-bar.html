<!doctype html>
<html><head><meta charset="utf-8"><style>
  :root{--ink:#1d1d1f;--mute:#6e6e73;--faint:#a1a1a6;--line:rgba(0,0,0,.09);--blue:#1e6fff;--bg:rgba(252,252,253,.97);--hover:rgba(0,0,0,.06);--field:rgba(0,0,0,.045);--tip:#1d1d1f;--tip-ink:#f5f5f7}
  @media(prefers-color-scheme:dark){:root{--ink:#f5f5f7;--mute:#a1a1a6;--faint:#6e6e73;--line:rgba(255,255,255,.12);--bg:rgba(30,30,33,.97);--hover:rgba(255,255,255,.09);--field:rgba(255,255,255,.07);--tip:#f5f5f7;--tip-ink:#1d1d1f}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden;font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none}
  /* 24px of clear window around the dock holds its soft shadow; 44px above it holds the button tooltips. */
  #dock{position:fixed;left:24px;right:24px;bottom:24px;border:1px solid var(--line);border-radius:28px;background:var(--bg);box-shadow:0 6px 18px rgba(0,0,0,.14);opacity:0;transform:translateY(8px) scale(.985);transition:opacity 260ms cubic-bezier(.32,.72,0,1),transform 320ms cubic-bezier(.32,.72,0,1)}
  #dock.in{opacity:1;transform:none}
  #noticeWrap{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows 360ms cubic-bezier(.32,.72,0,1),opacity 260ms ease}
  #dock.human #noticeWrap{grid-template-rows:1fr;opacity:1}
  #noticeClip{overflow:hidden;min-height:0}
  #notice{display:flex;align-items:flex-start;gap:12px;padding:13px 12px 11px 16px;border-bottom:1px solid var(--line)}
  #noticeText{flex:1;min-width:0}
  #noticeText b{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;margin-bottom:3px}
  #noticeText b i{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:beat 1.6s ease-in-out infinite}
  @keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(30,111,255,.45)}60%{box-shadow:0 0 0 6px rgba(30,111,255,0)}}
  #noticeText span{display:block;color:var(--mute);font-size:12.5px;line-height:1.42;user-select:text;-webkit-user-select:text}
  #resume{flex:none;margin-top:1px;height:30px;padding:0 15px;border-radius:15px;background:var(--blue);color:#fff;font-weight:600;font-size:12.5px;place-items:center;display:grid}
  #resume:hover{background:var(--blue);filter:brightness(1.08)}
  #dock{display:grid;overflow:hidden;transition:opacity 260ms cubic-bezier(.32,.72,0,1),transform 320ms cubic-bezier(.32,.72,0,1),background 420ms cubic-bezier(.32,.72,0,1),border-color 420ms ease,color 420ms ease}
  #row,#humanRow{grid-area:1/1;height:50px;transition:opacity 280ms ease,transform 380ms cubic-bezier(.32,.72,0,1)}
  #humanRow{display:flex;align-items:center;gap:10px;padding:0 9px 0 20px;opacity:0;transform:translateY(10px);pointer-events:none}
  .hdot{flex:none;width:8px;height:8px;border-radius:50%;background:#5b9dff;animation:beat 1.6s ease-in-out infinite}
  @keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(91,157,255,.55)}60%{box-shadow:0 0 0 7px rgba(91,157,255,0)}}
  .hmsg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:500;letter-spacing:-.005em}
  #resume{flex:none;height:32px;padding:0 16px;border-radius:16px;background:#fff;color:#12162a;font-weight:600;font-size:12.5px;display:grid;place-items:center}
  #resume:hover{background:#fff;filter:brightness(.94)}
  #stop2{flex:none;width:30px;height:30px;color:#ff8a8f}
  #stop2:hover{background:rgba(255,255,255,.12)}
  #dock.human{background:linear-gradient(180deg,#1b2036,#121528);border-color:rgba(120,165,255,.38);color:#f5f7ff;box-shadow:0 6px 22px rgba(18,30,80,.4),0 0 0 1px rgba(91,157,255,.12)}
  #dock.human #row{opacity:0;transform:translateY(-10px);pointer-events:none}
  #dock.human #humanRow{opacity:1;transform:none;pointer-events:auto}
  #dock.human [data-tip]::after{background:#fff;color:#12162a}
  /* The plan: its own small pill above the dock, folded to one line until it is pointed at or clicked. */
  #plan{position:fixed;left:50%;bottom:calc(24px + var(--dock-h,52px) + 8px);width:292px;margin-left:-146px;border:1px solid var(--line);border-radius:20px;background:var(--bg);box-shadow:0 4px 14px rgba(0,0,0,.12);opacity:0;transform:translateY(6px);transition:opacity 260ms ease,transform 320ms cubic-bezier(.32,.72,0,1),bottom 280ms cubic-bezier(.32,.72,0,1);pointer-events:none;overflow:hidden}
  #plan.on{opacity:1;transform:none;pointer-events:auto}
  #planHead{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 12px 0 13px;cursor:pointer;font-size:12.5px;color:var(--ink)}
  #planNow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
  #planCount{flex:none;color:var(--mute);font-size:11.5px;font-variant-numeric:tabular-nums}
  #chev{flex:none;color:var(--faint);transition:transform 260ms cubic-bezier(.32,.72,0,1)}
  #plan.open #chev{transform:rotate(180deg)}
  #bar{height:2px;margin:0 13px;border-radius:1px;background:var(--field);overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:var(--blue);border-radius:1px;transition:width 420ms cubic-bezier(.32,.72,0,1)}
  #listWrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows 300ms cubic-bezier(.32,.72,0,1)}
  #plan.open #listWrap{grid-template-rows:1fr}
  #list{overflow:hidden;min-height:0;list-style:none}
  #list li{display:flex;align-items:center;gap:10px;min-height:28px;padding:0 13px;font-size:12.5px;color:var(--mute);transition:color 220ms ease}
  #list li:first-child{margin-top:6px}#list li:last-child{margin-bottom:8px}
  #list li.active{color:var(--ink);font-weight:500}
  #list li.done{color:var(--faint)}
  .mark{position:relative;flex:none;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--faint);transition:background 240ms ease,border-color 240ms ease}
  li.active .mark{border-color:var(--blue);border-top-color:transparent;animation:spin 900ms linear infinite}
  li.done .mark{background:var(--blue);border-color:var(--blue);animation:none}
  li.done .mark::after{content:"";position:absolute;left:4px;top:1.5px;width:4px;height:7px;border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(42deg);animation:pop 260ms cubic-bezier(.3,1.5,.5,1)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pop{0%{transform:rotate(42deg) scale(0)}100%{transform:rotate(42deg) scale(1)}}
  #row{display:flex;align-items:center;gap:4px;padding:0 9px 0 18px}
  #mouse{flex:none;color:var(--blue);margin-right:6px;display:grid;place-items:center}
  #msg{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;user-select:text;-webkit-user-select:text;padding:7px 2px}
  #msg::placeholder{color:var(--mute)}
  button{all:unset;box-sizing:border-box;position:relative;cursor:pointer;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;color:var(--ink);transition:background 140ms ease,transform 140ms ease,opacity 140ms ease}
  button:hover{background:var(--hover)} button:active{transform:scale(.93)}
  button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
  #send{background:var(--blue);color:#fff;width:0;opacity:0;pointer-events:none;margin-left:0;transform:scale(.7);transition:width 200ms cubic-bezier(.32,.72,0,1),opacity 160ms ease,transform 200ms cubic-bezier(.3,1.4,.5,1),margin 200ms ease}
  #send.on{width:32px;opacity:1;pointer-events:auto;transform:none;margin-left:2px} #send:hover{background:var(--blue);filter:brightness(1.08)}
  #stop svg{color:#e5484d}
  #dock.human #pause{display:none}
  #dock.human{border-color:rgba(30,111,255,.4)}
  /* Tooltips: custom, because native titles do not show in a non-activating panel. */
  [data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 9px);left:50%;transform:translate(-50%,4px);padding:5px 9px;border-radius:8px;background:var(--tip);color:var(--tip-ink);font-size:11.5px;font-weight:500;line-height:1;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 120ms ease,transform 160ms cubic-bezier(.32,.72,0,1);z-index:5}
  [data-tip]:hover::after{opacity:1;transform:translate(-50%,0);transition-delay:350ms}
  #stop[data-tip]::after,#pause[data-tip]::after{left:auto;right:0;transform:translate(0,4px)}
  #stop[data-tip]:hover::after,#pause[data-tip]:hover::after{transform:translate(0,0)}
  @media(prefers-reduced-motion:reduce){#dock,#plan,#noticeWrap,#listWrap,#bar i,#chev,#send,[data-tip]::after{transition-duration:1ms}#noticeText b i{animation:none}li.active .mark{animation:none;border-top-color:var(--blue)}li.done .mark::after{animation:none}}
</style></head><body>
<div id="plan">
  <button id="planHead" aria-expanded="false" aria-label="Show the plan" style="all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 12px 0 13px;cursor:pointer;font-size:12.5px">
    <span id="planNow"></span><span id="planCount"></span>
    <svg id="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
  </button>
  <div id="bar"><i></i></div>
  <div id="listWrap"><ul id="list"></ul></div>
</div>
<div id="dock">
  <div id="row">
    <span id="mouse" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="6"/><path d="M12 6.5v4"/></svg></span>
    <input id="msg" placeholder="Message Clyra…" maxlength="1200" autocomplete="off" spellcheck="true" aria-label="Message Clyra while it works">
    <button id="send" data-tip="Send to Clyra" aria-label="Send message"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    <button id="pause" data-tip="Pause" aria-label="Pause"></button>
    <button id="stop" data-tip="Stop and give control back" aria-label="Stop"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
  </div>
  <div id="humanRow" aria-live="polite">
    <i class="hdot"></i>
    <span id="note" class="hmsg">Your turn</span>
    <button id="resume" data-tip="Let Clyra carry on" aria-label="Resume">Resume</button>
    <button id="stop2" data-tip="Stop and give control back" aria-label="Stop"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
  </div>
</div>
<script>
const $=(id)=>document.getElementById(id);
const dock=$("dock"),msg=$("msg"),send=$("send"),pause=$("pause"),note=$("note"),plan=$("plan"),list=$("list");
const PAUSE='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.3"/><rect x="13.5" y="5" width="4" height="14" rx="1.3"/></svg>';
const PLAY='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
let status="running", open=false, lastPlan="";
function renderPlan(s){
  const items=s.plan||[];
  const show=items.length>1;
  plan.classList.toggle("on",show);
  if(!show)return;
  const done=items.filter(i=>i.status==="done").length;
  const active=items.find(i=>i.status==="active")||items.find(i=>i.status==="pending");
  $("planNow").textContent=s.status==="paused"?"Paused · "+(active?active.title:""):(active?active.title:"Finishing up");
  $("planCount").textContent=Math.min(done+(active?1:0),items.length)+" of "+items.length;
  $("bar").firstElementChild.style.width=(items.length?Math.round(done/items.length*100):0)+"%";
  const sig=JSON.stringify(items);
  if(sig!==lastPlan){lastPlan=sig;list.innerHTML="";for(const it of items){const li=document.createElement("li");li.className=it.status;const m=document.createElement("span");m.className="mark";const t=document.createElement("span");t.textContent=it.title;li.append(m,t);list.appendChild(li);}}
}
function apply(s){
  status=s.status;
  const human=s.status==="needs_user", paused=s.status==="paused";
  dock.classList.toggle("human",human);
  note.textContent=s.message||"Your turn";note.title=s.message||"";
  renderPlan(s);
  pause.innerHTML=paused?PLAY:PAUSE; pause.dataset.tip=paused?"Resume":"Pause"; pause.setAttribute("aria-label",pause.dataset.tip);
  if(["planning","running","paused","needs_user"].includes(s.status)) requestAnimationFrame(()=>dock.classList.add("in"));
  else dock.classList.remove("in");
  report();
}
let lastH=0;
function report(){document.documentElement.style.setProperty("--dock-h",dock.offsetHeight+"px");const h=Math.ceil(dock.offsetHeight)+24+44+(plan.classList.contains("on")?270:0);if(h!==lastH){lastH=h;window.computerBar.size(h);}}
new ResizeObserver(report).observe(dock);
$("planHead").onclick=()=>{open=!open;plan.classList.toggle("open",open);$("planHead").setAttribute("aria-expanded",String(open));};
plan.addEventListener("mouseenter",()=>{plan.classList.add("open");});plan.addEventListener("mouseleave",()=>{if(!open)plan.classList.remove("open");});
window.computerBar.onState(apply); window.computerBar.ready();
pause.onclick=()=>status==="paused"?window.computerBar.resume():window.computerBar.pause();
$("resume").onclick=()=>window.computerBar.humanDone();
$("stop").onclick=()=>window.computerBar.stop();$("stop2").onclick=()=>window.computerBar.stop();
function submit(){const t=msg.value.trim();if(!t)return;window.computerBar.send(t);msg.value="";send.classList.remove("on");}
send.onclick=submit;
msg.addEventListener("input",()=>send.classList.toggle("on",!!msg.value.trim()));
msg.addEventListener("keydown",(e)=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();submit();}});
pause.innerHTML=PAUSE;
</script></body></html>
