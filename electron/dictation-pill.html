<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Clyra Dictation</title>
  <style>
    /* Clyra Flow pill.
       One graphite capsule that sits on any wallpaper or app: [ voice meter ] [ words ] [ stop ].
       - The meter is the real microphone level (one canvas, one draw per frame).
       - The ring around Stop drains as the session is about to end on its own, so auto-stop is never a surprise.
       - Only width/height of this one element and opacity/transform of its children ever animate. */
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      --surface: #14161b; --hairline: rgba(255,255,255,.11); --ink: #f3f4f6; --mute: #9299a6; --faint: rgba(255,255,255,.08);
      --accent: #6c9bff; --accent-strong: #2f6bff; --danger: #ff6b61; --ok: #3ddc84;
      --out: cubic-bezier(.22, 1, .36, 1);          /* everything settles with this curve */
      --pop: cubic-bezier(.34, 1.36, .64, 1);       /* entrances only: a small overshoot */
      --t-size: .42s; --t-fade: .2s;
    }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: transparent; -webkit-font-smoothing: antialiased; user-select: none; }
    #stage { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 22px; box-sizing: border-box; }

    #pill { --w: 44px; --h: 44px; --r: 22px; position: relative; box-sizing: border-box; width: var(--w); height: var(--h); border-radius: var(--r); cursor: grab;
      opacity: 0; transform: translateY(10px) scale(.72); transform-origin: 50% 100%; pointer-events: auto;
      transition: width var(--t-size) var(--out), height var(--t-size) var(--out), border-radius var(--t-size) var(--out), opacity .16s ease, transform .22s var(--out);
      will-change: width, height, transform, opacity; contain: layout style; }
    #pill[data-ready="true"] { opacity: 1; transform: none; transition: width var(--t-size) var(--out), height var(--t-size) var(--out), border-radius var(--t-size) var(--out), opacity .2s ease, transform .5s var(--pop); }
    #pill.dragging { cursor: grabbing; }
    .clip { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; box-sizing: border-box; background: var(--surface);
      box-shadow: inset 0 0 0 1px var(--hairline), 0 6px 18px -6px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.3); }

    /* what you highlighted, and what Flow will do with it */
    .selchip { position: absolute; left: 50%; bottom: calc(100% + 8px); max-width: 340px; height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 10px; border-radius: 13px; white-space: nowrap; box-sizing: border-box;
      background: var(--surface); box-shadow: inset 0 0 0 1px var(--hairline); font-size: 12px; color: var(--mute); opacity: 0; transform: translate(-50%, 6px); transition: opacity .2s ease, transform .4s var(--out); pointer-events: none; }
    .selchip.show { opacity: 1; transform: translate(-50%, 0); }
    .selchip .tag { flex: 0 0 auto; font-size: 10px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
    .selchip .quote { overflow: hidden; text-overflow: ellipsis; min-width: 0; }

    .layer { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .14s ease, visibility 0s linear .14s; }
    .layer.on { opacity: 1; visibility: visible; transition: opacity .28s ease .08s, visibility 0s; }

    button { appearance: none; border: 0; padding: 0; margin: 0; cursor: pointer; font: inherit; color: inherit; background: none; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* the row: [lead 28] [mid flex] [end 28] with 8px gaps and 8px side padding. It is always exactly as wide as the
       capsule, so the stop button rides the edge while the capsule grows and nothing inside is ever re-centred. */
    .row { position: absolute; top: 0; left: 0; height: 44px; width: 100%; display: flex; align-items: center; gap: 8px; padding: 0 8px; box-sizing: border-box; }
    .card .row { top: auto; bottom: 0; height: 100%; align-items: flex-end; padding-bottom: 8px; }
    .slot { position: relative; flex: 0 0 28px; width: 28px; height: 28px; display: grid; place-items: center; }
    .slot > * { grid-area: 1 / 1; transition: opacity var(--t-fade) ease, transform .3s var(--out); }
    .off { opacity: 0; transform: scale(.6); pointer-events: none; }

    /* lead slot: meter while listening, spinner while working, x on hover */
    #meter { width: 28px; height: 28px; display: block; }
    .cancel { position: relative; z-index: 2; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--mute); background: var(--faint); }
    .cancel:hover { color: var(--ink); background: rgba(255,255,255,.16); }
    .cancel:active, .stop:active { transform: scale(.9); }
    .cancel svg { width: 10px; height: 10px; }
    #pill:not(.hovered) #cancel, #pill.locked #cancel { opacity: 0; transform: scale(.6); pointer-events: none; }
    #pill.hovered:not(.locked) .lead-live { opacity: 0; transform: scale(.6); pointer-events: none; }
    .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.14); border-top-color: var(--accent); box-sizing: border-box; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .slot > .spinner.off { animation-play-state: paused; transform: none; }
    .status { width: 20px; height: 20px; }
    .status svg { width: 20px; height: 20px; display: block; overflow: visible; }
    .status .disc { transform-origin: 10px 10px; transform: scale(0); }
    .status.show .disc { animation: discIn .45s var(--pop) forwards; }
    .status .mark { fill: none; stroke: var(--surface); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 16; stroke-dashoffset: 16; }
    .status.show .mark { animation: draw .3s .16s ease-out forwards; }
    @keyframes discIn { to { transform: scale(1); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* end slot: stop, wrapped by the auto-stop ring */
    .stop { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); }
    .stop:hover { background: #fff; }
    .stop i { display: block; width: 9px; height: 9px; border-radius: 2.5px; background: var(--surface); }
    #ring { position: absolute; inset: -3px; width: 34px; height: 34px; transform: rotate(-90deg); pointer-events: none; opacity: 0; transition: opacity .2s ease; }
    #ring.on { opacity: 1; }
    #ring circle { fill: none; stroke-width: 2; }
    #ring .trail { stroke: rgba(255,255,255,.12); }
    #ring .arc { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 97.4; stroke-dashoffset: 0; transition: stroke-dashoffset .14s linear; }
    #end.gone { flex-basis: 0; width: 0; margin-left: -8px; opacity: 0; pointer-events: none; }
    #end { transition: opacity var(--t-fade) ease; }

    /* middle: a quiet hint until there are words, then the words */
    .mid { position: relative; flex: 1; min-width: 0; height: 28px; overflow: hidden; }
    .card .mid { height: 100%; }
    .hint { position: absolute; inset: 0; display: flex; align-items: center; font-size: 13px; font-weight: 500; letter-spacing: -.005em; color: var(--mute); white-space: nowrap; transition: opacity var(--t-fade) ease; }
    .has-text .hint { opacity: 0; }
    .working .hint, .thinking .w { background: linear-gradient(100deg, var(--mute) 35%, #e9edf5 50%, var(--mute) 65%); background-size: 240% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.5s linear infinite; }
    .thinking .w { background-attachment: fixed; }
    @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
    .text { position: absolute; inset: 0; display: flex; align-items: center; overflow: hidden; opacity: 0; transition: opacity var(--t-fade) ease;
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 18px, #000 100%); mask-image: linear-gradient(to right, transparent 0, #000 18px, #000 100%); }
    .has-text .text { opacity: 1; }
    .text.fits { -webkit-mask-image: none; mask-image: none; }
    /* one line while you speak: newest words on the right, older words slide off to the left */
    .track { white-space: nowrap; flex: 0 0 auto; font-size: 13.5px; font-weight: 500; letter-spacing: -.01em; line-height: 18px; color: var(--ink); will-change: transform; transition: transform .26s var(--out); }
    .final-mode .text { align-items: flex-end; -webkit-mask-image: none; mask-image: none; overflow-y: auto; }
    .final-mode .text::-webkit-scrollbar { display: none; }
    .final-mode .track { white-space: normal; flex: 1 1 auto; transform: none !important; padding: 5px 0; }
    .final-mode.one-line .track { white-space: nowrap; }
    .w { display: inline-block; transition: color .3s ease, opacity .3s ease, text-decoration-color .3s ease; }
    .w.in { animation: wordIn .3s var(--out) both; }
    @keyframes wordIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    /* edits: removed words are struck through and fade, new words arrive in the accent colour */
    .w.del { text-decoration: line-through; text-decoration-thickness: 1.5px; text-decoration-color: transparent; }
    .w.del.struck { color: var(--danger); text-decoration-color: var(--danger); opacity: .75; }
    .w.add { color: var(--accent); opacity: 0; transform: translateY(5px); transition: color .3s ease, opacity .3s ease, transform .4s var(--out); }
    .w.add.shown { opacity: 1; transform: none; }
    .note { color: var(--accent); }

    /* single-message capsule (errors, "Inserted") and the Replace / Enhance chooser */
    .msg { position: absolute; inset: 0; display: flex; align-items: center; gap: 9px; padding: 0 16px 0 12px; font-size: 12.5px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; }
    .msg span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .msg .dot { flex: 0 0 auto; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--surface); font-size: 11px; font-weight: 700; }
    .msg.error .dot { background: var(--danger); }
    .l-select { display: flex; align-items: center; gap: 6px; padding: 0 8px; }
    .choice { flex: 1; height: 28px; border-radius: 14px; background: var(--faint); color: var(--ink); font-size: 12px; font-weight: 600; transition: background .16s ease, color .16s ease; }
    .choice:hover { background: var(--accent-strong); color: #fff; }

    @media (prefers-reduced-motion: reduce) {
      #pill, #pill[data-ready="true"], .layer, .w, .slot > *, .track, #ring .arc { transition-duration: 1ms !important; }
      .w.in, .status .disc, .status .mark, .working .hint, .thinking .w { animation: none !important; }
      .status .disc { transform: none; } .status .mark { stroke-dashoffset: 0; }
      .working .hint, .thinking .w { background: none; color: var(--mute); }
    }
  </style>
</head>
<body>
  <main id="stage">
    <div id="pill" data-mode="circle" data-ready="false" role="status" aria-live="polite">
      <div class="selchip" id="selchip"><span class="tag" id="seltag"></span><span class="quote" id="selquote"></span></div>
      <div class="clip" id="clip">
        <div class="layer" id="l-dot"><div class="row"><div class="slot"><span class="spinner"></span></div></div></div>
        <div class="layer" id="l-main">
          <div class="row" id="row">
            <div class="slot" id="lead">
              <canvas class="lead-live" id="meter" width="56" height="56" aria-hidden="true"></canvas>
              <span class="spinner lead-live off" id="spinner"></span>
              <span class="status lead-live off" id="status"></span>
              <button class="cancel" id="cancel" type="button" aria-label="Cancel dictation" title="Cancel (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
            </div>
            <div class="mid" id="mid">
              <div class="hint" id="hint">Listening</div>
              <div class="text" id="text"><div class="track" id="track"></div></div>
            </div>
            <div class="slot" id="end">
              <button class="stop" id="primary" type="button" aria-label="Finish dictation" title="Finish"><i></i></button>
              <svg id="ring" viewBox="0 0 34 34" aria-hidden="true"><circle class="trail" cx="17" cy="17" r="15.5"/><circle class="arc" id="arc" cx="17" cy="17" r="15.5"/></svg>
            </div>
          </div>
        </div>
        <div class="layer" id="l-msg"><div class="msg" id="msg"><i class="dot" id="msgdot">!</i><span id="msgtext"></span></div></div>
        <div class="layer l-select" id="l-select"><button class="cancel" id="selection-cancel" type="button" aria-label="Cancel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><button class="choice" id="replace" type="button">Replace</button><button class="choice" id="enhance" type="button">Enhance</button></div>
      </div>
    </div>
  </main>
  <script>
    const pill = document.getElementById('pill');
    const api = window.clyraDictationPill;
    const $ = (id) => document.getElementById(id);
    const mid = $('mid'), track = $('track'), row = $('row'), textBox = $('text'), hint = $('hint');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const H = 44, LINE = 18;
    let phase = 'idle', mode = 'circle', hovering = false, dragging = null;
    let cardOpen = false, liveText = '', timers = [];
    const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
    const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
    const isVisible = () => pill.dataset.ready === 'true';
    const maxW = () => Math.max(220, Math.min(348, innerWidth - 32));

    // ---------------------------------------------------------------- shape
    function setSize(w, h, r) { pill.style.setProperty('--w', w + 'px'); pill.style.setProperty('--h', h + 'px'); pill.style.setProperty('--r', r + 'px'); }
    /** Which glyph the lead slot shows: the live meter, the working spinner, a status mark, or nothing. */
    function lead(name) { for (const id of ['meter', 'spinner', 'status']) $(id).classList.toggle('off', id !== name); }
    function show(next) {
      mode = next; pill.dataset.mode = next;
      const key = next === 'circle' ? 'l-dot' : next === 'msg' ? 'l-msg' : next === 'select' ? 'l-select' : 'l-main';
      for (const id of ['l-dot', 'l-main', 'l-msg', 'l-select']) $(id).classList.toggle('on', id === key);
      pill.classList.toggle('card', next === 'card');
      // Cancel only makes sense while there is something to cancel.
      pill.classList.toggle('locked', next === 'card');
      if (next === 'circle') setSize(H, H, H / 2);
      else if (next === 'select') setSize(236, H, H / 2);
      else if (next === 'msg') setSize(Math.min(maxW(), Math.max(150, 58 + textWidth($('msgtext').textContent, 12.5))), H, H / 2);
      else if (next !== 'card') { lastWidth = widthFor(next); setSize(lastWidth, H, H / 2); }
      const hasText = Boolean(liveText) && next !== 'circle';
      mid.classList.toggle('has-text', hasText || next === 'card');
      mid.classList.toggle('working', next === 'think');
      mid.classList.toggle('thinking', next === 'think');
      $('end').classList.toggle('gone', next !== 'listen');
      if (next === 'listen') lead('meter'); else if (next === 'think') lead('spinner');
      if (next !== 'listen') setEnding(0);
      if (!isVisible()) setHover(false);
    }
    function appear(next) {
      if (isVisible()) { next(); return; }
      show('circle');
      requestAnimationFrame(() => requestAnimationFrame(() => { pill.dataset.ready = 'true'; next(); }));
    }

    // Widths come from canvas text measurement (no layout reads) and move in 8px steps, so a live transcript never
    // forces layout or keeps retargeting the width transition.
    const BASE_W = 168, GROW_W = 348;
    const measureCtx = document.createElement('canvas').getContext('2d');
    const FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif';
    function textWidth(t, size = 13.5) { if (!t) return 0; measureCtx.font = `500 ${size}px ${FONT}`; return measureCtx.measureText(t).width - t.length * (size === 13.5 ? .135 : 0); }
    let lastWidth = 0;
    /** Chrome around the words: side padding, the lead slot, gaps and (while listening) the stop button. */
    const chromeW = (m) => 8 + 28 + 8 + (m === 'listen' ? 8 + 28 : 6) + 8;
    function widthFor(m) {
      const words = track.textContent.trim();
      const need = chromeW(m) + (words ? textWidth(words) + 4 : textWidth(hint.textContent, 13) + 6);
      // While you speak the capsule only ever grows: a first short word must not make it shrink and re-expand.
      const floor = m === 'listen' ? Math.max(BASE_W, mode === 'listen' ? lastWidth : 0) : 120;
      return Math.min(Math.ceil(Math.max(floor, need) / 8) * 8, GROW_W, maxW());
    }
    /** Keep the newest words in view: the track slides left once it outgrows the capsule. */
    function followTail() {
      if (mode !== 'listen' && mode !== 'think') return;
      const w = widthFor(mode);
      if (w !== lastWidth) { lastWidth = w; setSize(w, H, H / 2); }
      const visible = w - chromeW(mode);
      const over = Math.max(0, textWidth(track.textContent.trim()) + 4 - visible);
      textBox.classList.toggle('fits', over === 0);
      track.style.transform = over ? `translateX(${-Math.round(over)}px)` : '';
    }

    // ---------------------------------------------------------------- words
    function wordSpan(text, cls, i) { const s = document.createElement('span'); s.className = 'w ' + cls; s.style.setProperty('--i', i); s.textContent = text; return s; }
    function setWords(segments) {
      track.textContent = '';
      let i = 0;
      for (const seg of segments) for (const word of String(seg.text).split(/\s+/).filter(Boolean)) track.append(wordSpan(word, seg.type, i++), document.createTextNode(' '));
    }
    // Words are released at a steady pace (faster when there is a backlog), so a phrase that arrives all at once
    // still types in smoothly instead of popping.
    let target = [], paceTimer = 0, paceBase = 70, printing = false;
    function revealNext() {
      paceTimer = 0;
      let have = track.querySelectorAll('.w').length;
      if (have >= target.length) { printing = false; return; }
      const backlog = target.length - have;
      const step = Math.min(backlog, printing ? Math.max(1, Math.ceil(backlog / 12)) : backlog > 10 ? 3 : backlog > 4 ? 2 : 1);
      const batch = document.createDocumentFragment();
      for (let k = 0; k < step; k++, have++) batch.append(wordSpan(target[have], 'same in', have), document.createTextNode(' '));
      track.append(batch);
      followTail();
      if (have < target.length) paceTimer = setTimeout(revealNext, Math.max(16, paceBase - backlog * 6));
      else printing = false;
    }
    function flushWords() {
      clearTimeout(paceTimer); paceTimer = 0;
      const have = track.querySelectorAll('.w').length;
      for (let i = have; i < target.length; i++) track.append(wordSpan(target[i], 'same', i), document.createTextNode(' '));
      followTail();
    }
    /** Live transcript: shown words are revised in place, new words are paced in on the right. */
    function setLive(text, flush) {
      const next = String(text || '').split(/\s+/).filter(Boolean);
      if (!flush && next.join(' ') === liveText) return;
      printing = false; paceBase = 70;
      liveText = next.join(' ');
      target = next;
      const spans = Array.from(track.querySelectorAll('.w'));
      for (let i = 0; i < Math.min(spans.length, next.length); i++) if (spans[i].textContent !== next[i]) spans[i].textContent = next[i];
      for (let i = spans.length - 1; i >= next.length; i--) { spans[i].nextSibling?.remove(); spans[i].remove(); }
      mid.classList.toggle('has-text', next.length > 0);
      mid.classList.remove('final-mode', 'one-line');
      if (flush || reduceMotion) flushWords();
      else if (!paceTimer && track.querySelectorAll('.w').length < next.length) paceTimer = setTimeout(revealNext, 0);
      followTail();
    }

    /** How text will lay out in the card, measured on an off-screen probe (never the live track). */
    const probe = document.createElement('div');
    probe.style.cssText = `position:absolute;left:-9999px;top:0;visibility:hidden;font-size:13.5px;font-weight:500;letter-spacing:-.01em;line-height:${LINE}px;white-space:normal;`;
    document.body.append(probe);
    function measure(text) {
      const chrome = chromeW('card');
      probe.style.whiteSpace = 'nowrap'; probe.style.width = 'auto'; probe.textContent = text;
      const single = probe.scrollWidth + 2;
      const textMax = maxW() - chrome;
      if (single <= textMax) return { lines: 1, width: Math.round(Math.max(120, chrome + single)) };
      probe.style.whiteSpace = 'normal'; probe.style.width = textMax + 'px';
      return { lines: Math.max(1, Math.round(probe.scrollHeight / LINE)), width: maxW() };
    }
    /** Result card: one line stays a capsule sized to the words; longer text grows upward once, to its final height. */
    function fitCard(text) {
      if (mode !== 'card') return;
      const words = text != null ? String(text) : Array.from(track.querySelectorAll('.w')).map((w) => w.textContent).join(' ');
      const { lines, width } = measure(words);
      const oneLine = lines <= 1;
      mid.classList.toggle('one-line', oneLine);
      const h = oneLine ? H : Math.min(8, lines) * LINE + 26;
      setSize(width, h, oneLine ? H / 2 : 20);
    }

    // ---------------------------------------------------------------- edits + final
    function openCard() {
      cardOpen = true;
      mid.classList.remove('thinking', 'working'); mid.classList.add('has-text', 'final-mode');
      track.style.transition = 'none'; track.style.transform = ''; void track.offsetWidth; track.style.transition = '';
      show('card'); lead('spinner');
    }
    function openDiff(payload) {
      clearTimers(); clearTimeout(paceTimer); paceTimer = 0;
      setWords(payload.diff);
      openCard();
      fitCard();
      const dels = Array.from(track.querySelectorAll('.w.del')), adds = Array.from(track.querySelectorAll('.w.add'));
      dels.forEach((el, i) => later(() => el.classList.add('struck'), 220 + i * 60));
      const t = 220 + dels.length * 60 + 160;
      adds.forEach((el, i) => later(() => el.classList.add('shown'), t + i * 80));
    }
    function revealFinal(payload) {
      clearTimers(); clearTimeout(paceTimer); paceTimer = 0;
      const words = String(payload.finalText || '').split(/\s+/).filter(Boolean);
      if (!cardOpen) flushWords();
      const plain = (t) => t.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, '');
      const spans = Array.from(track.querySelectorAll('.w'));
      // The same words you watched appear (at most their case or punctuation was tidied): fix them in place.
      const already = !cardOpen && spans.length === words.length && plain(liveText) === plain(words.join(' '));
      if (!cardOpen) openCard();
      fitCard(words.join(' '));
      // What you watched appear while speaking is already the final text: leave it exactly where it is.
      if (already) { spans.forEach((span, i) => { if (span.textContent !== words[i]) span.textContent = words[i]; }); liveText = words.join(' '); target = words; return; }
      track.style.transition = 'opacity .12s ease'; track.style.opacity = '0';
      later(() => {
        track.textContent = ''; track.style.opacity = '1';
        target = words; printing = true; paceBase = Math.max(16, Math.min(40, 700 / Math.max(1, words.length)));
        if (reduceMotion) flushWords(); else revealNext();
      }, 120);
    }
    const ICON_CHECK = '<svg viewBox="0 0 20 20"><circle class="disc" cx="10" cy="10" r="10" fill="var(--ok)"/><path class="mark" d="M5.8 10.4l2.8 2.8 5.6-6"/></svg>';
    const ICON_CLIP = '<svg viewBox="0 0 20 20"><circle class="disc" cx="10" cy="10" r="10" fill="var(--accent)"/><path class="mark" d="M7 6.5h6v8H7zM8.6 6.5v-1h2.8v1"/></svg>';
    function landStatus(detail, clipboard) {
      const status = $('status');
      status.innerHTML = clipboard ? ICON_CLIP : ICON_CHECK;
      status.className = 'status lead-live';
      lead('status');
      requestAnimationFrame(() => status.classList.add('show'));
      // The text went to the clipboard instead of a field: say so, in place of the words.
      if (clipboard) later(() => {
        track.textContent = ''; const s = wordSpan(detail || 'Saved to clipboard', 'same in note', 0); s.style.display = 'inline'; track.append(s);
        fitCard(detail || 'Saved to clipboard');
      }, 900);
    }

    // ---------------------------------------------------------------- sound design
    // Soft, layered tones (sine + a quiet octave harmonic) through a gentle low-pass and a short synthetic room,
    // so every cue is one family: falling = off, bright triad = done.
    let audio = null, bus = null;
    function ensureAudio() {
      if (audio) { if (audio.state === 'suspended') audio.resume().catch(() => {}); return audio; }
      audio = new (window.AudioContext || window.webkitAudioContext)();
      const master = audio.createGain(); master.gain.value = .9;
      const lp = audio.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200; lp.Q.value = .4;
      const dry = audio.createGain(); dry.gain.value = 1;
      const wet = audio.createGain(); wet.gain.value = .22;
      const conv = audio.createConvolver();
      const len = Math.floor(audio.sampleRate * .45), ir = audio.createBuffer(2, len, audio.sampleRate);
      for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
      conv.buffer = ir;
      lp.connect(dry).connect(master); lp.connect(conv); conv.connect(wet).connect(master); master.connect(audio.destination);
      bus = lp;
      if (audio.state === 'suspended') audio.resume().catch(() => {});
      return audio;
    }
    function note(freq, at, dur, { gain = .14, glide = 0, harm = .22, attack = .012 } = {}) {
      const ctx = ensureAudio(); const t0 = ctx.currentTime + .005 + at;
      for (const [mult, g] of [[1, gain], [2, gain * harm]]) {
        const osc = ctx.createOscillator(), amp = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(freq * mult, t0);
        if (glide) osc.frequency.exponentialRampToValueAtTime(glide * mult, t0 + dur);
        amp.gain.setValueAtTime(.0001, t0); amp.gain.exponentialRampToValueAtTime(g, t0 + attack); amp.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
        osc.connect(amp).connect(bus); osc.start(t0); osc.stop(t0 + dur + .05);
      }
    }
    const SOUNDS = {
      start:  () => {},   // silent on purpose: a beep here leaks into the microphone and swallows the first words
      stop:   () => { note(659.25, 0, .13, { gain: .1 }); note(493.88, .07, .2, { gain: .1 }); },
      done:   () => { note(659.25, 0, .16, { gain: .1 }); note(830.61, .07, .18, { gain: .1 }); note(1046.5, .14, .36, { gain: .11 }); },
      copied: () => { note(783.99, 0, .14, { gain: .1 }); note(987.77, .09, .28, { gain: .1 }); },
      cancel: () => note(440, 0, .18, { gain: .09, glide: 261.63 }),
      error:  () => { note(196, 0, .2, { gain: .12, harm: .1 }); note(155.56, .15, .3, { gain: .12, harm: .1 }); },
    };
    let lastPhase = 'idle';
    function playFor(payload) {
      const next = payload.phase || 'idle';
      if (payload.sound === false) { lastPhase = next; return; }
      try {
        if (next === 'listening' && lastPhase !== 'listening') SOUNDS.start();
        else if ((next === 'processing' || next === 'optimising') && lastPhase === 'listening') SOUNDS.stop();
        else if (next === 'done' && lastPhase !== 'done') (payload.clipboard ? SOUNDS.copied : SOUNDS.done)();
        else if (next === 'error' && lastPhase !== 'error') SOUNDS.error();
        else if (next === 'idle' && ['arming', 'listening', 'processing', 'optimising', 'preview', 'selection'].includes(lastPhase)) SOUNDS.cancel();
      } catch { /* audio is best-effort */ }
      lastPhase = next;
    }
    // The audio engine is built on the first cue, not at load: an idle spare pill costs nothing.

    // ---------------------------------------------------------------- voice meter + auto-stop ring
    // Five bars that are the microphone: each bar eases toward the live level with its own weight and a little
    // per-bar motion, drawn on one small canvas. The loop only runs while listening and the pill is visible.
    const meterCanvas = $('meter'), meterCtx = meterCanvas.getContext('2d');
    const BARS = [.55, .85, 1, .8, .5];
    const bars = BARS.map(() => 0);
    let inputLevel = 0, smoothLevel = 0, wavePhase = 0, waveRaf = 0, lastFrame = 0;
    function drawMeter(now) {
      waveRaf = 0;
      const dt = Math.min(48, now - (lastFrame || now)) / 16.7; lastFrame = now;
      wavePhase += .16 * dt;
      smoothLevel += (inputLevel - smoothLevel) * Math.min(1, .28 * dt);
      const w = meterCanvas.width, h = meterCanvas.height, s = w / 28;
      meterCtx.clearRect(0, 0, w, h);
      const active = Math.min(1, smoothLevel * 1.5);
      meterCtx.fillStyle = active > .06 ? '#6c9bff' : '#5a6272';
      for (let i = 0; i < BARS.length; i++) {
        const wobble = .72 + .28 * Math.sin(wavePhase * (1.1 + i * .23) + i * 1.7);
        const want = 3 + BARS[i] * (active * 17 * wobble + (active > .06 ? 1.5 : .8 + .8 * Math.sin(wavePhase * .5 + i)));
        bars[i] += (want - bars[i]) * Math.min(1, .35 * dt);
        const bh = Math.max(3, Math.min(20, bars[i])) * s, bw = 2.6 * s, x = (5.2 + i * 3.9) * s, y = (h - bh) / 2;
        meterCtx.beginPath(); meterCtx.roundRect(x, y, bw, bh, bw / 2); meterCtx.fill();
      }
      if (phase === 'listening' && isVisible() && !reduceMotion) waveRaf = requestAnimationFrame(drawMeter);
    }
    function ensureMeter() { if (!waveRaf) { lastFrame = 0; waveRaf = requestAnimationFrame(drawMeter); } }
    const RING = 97.4;
    function setEnding(value) {
      const v = Math.max(0, Math.min(1, Number(value) || 0));
      $('ring').classList.toggle('on', v > 0.02);
      $('arc').style.strokeDashoffset = String(-RING * v);   // the arc drains clockwise from the top
    }
    function onMeter(meter) {
      if (phase !== 'listening') return;
      inputLevel = Math.max(0, Math.min(1, Number(meter && meter.level) || 0));
      setEnding(meter && meter.ending);
      if (reduceMotion) ensureMeter();
    }

    // ---------------------------------------------------------------- state machine
    let readyTimer = 0;
    function collapse() {
      clearTimers(); clearTimeout(paceTimer); paceTimer = 0; cardOpen = false;
      setEnding(0);
      clearTimeout(readyTimer);
      // Leave as it arrived: fade and sink in place, then reset out of sight.
      pill.dataset.ready = 'false';
      setHover(false);
      readyTimer = setTimeout(() => {
        show('circle'); lead('meter'); $('status').className = 'status lead-live off';
        track.textContent = ''; track.style.transform = ''; liveText = ''; target = [];
        mid.className = 'mid'; hint.textContent = 'Listening';
      }, 260);
    }
    function updateSelection(payload) {
      const chip = $('selchip');
      const sel = String(payload.selectedText || '').replace(/\s+/g, ' ').trim();
      const active = ['listening', 'processing', 'optimising'].includes(payload.phase);
      if (!sel || !active) { chip.classList.remove('show'); return; }
      const edit = payload.edit;
      $('seltag').textContent = edit === 'rewrite' ? 'Rewriting selection' : edit === 'replace' ? 'Replacing selection' : 'Selected text';
      const instruction = edit === 'rewrite' ? String(payload.partial || '').trim() : '';
      const text = instruction || sel;
      $('selquote').textContent = (instruction ? '“' : '') + (text.length > 64 ? text.slice(0, 61) + '…' : text) + (instruction ? '”' : '');
      chip.classList.add('show');
    }
    function message(text, kind) {
      $('msg').className = 'msg' + (kind === 'error' ? ' error' : '');
      $('msgdot').textContent = kind === 'error' ? '!' : '✓';
      $('msgtext').textContent = text;
      show('msg');
    }
    function render(payload = {}) {
      updateSelection(payload);
      playFor(payload);
      phase = payload.phase || 'idle';
      const detail = String(payload.detail || '').trim();
      if (phase === 'idle') { collapse(); return; }
      clearTimeout(readyTimer);
      if (phase === 'arming') {
        if (!isVisible()) { cardOpen = false; track.textContent = ''; liveText = ''; target = []; mid.className = 'mid'; lead('meter'); $('status').className = 'status lead-live off'; appear(() => show('circle')); }
        return;
      }
      if (phase === 'listening') {
        hint.textContent = 'Listening';
        if (payload.level != null) inputLevel = Math.max(0, Math.min(1, Number(payload.level) || 0));
        if (payload.ending != null) setEnding(payload.ending);
        appear(() => { setLive(payload.partial || ''); if (mode !== 'listen') { show('listen'); followTail(); } ensureMeter(); });
        return;
      }
      if (phase === 'processing' || phase === 'optimising') {
        hint.textContent = detail && detail !== 'Thinking' ? detail : 'Transcribing';
        appear(() => { if (payload.partial) setLive(payload.partial, true); else flushWords(); show('think'); followTail(); });
        return;
      }
      appear(() => settle(payload, detail));
    }
    function settle(payload, detail) {
      if (phase === 'refining') { if (!cardOpen) openDiff(payload); return; }
      if (phase === 'revealing') { revealFinal(payload); return; }
      if (phase === 'done') {
        if (cardOpen) { landStatus(detail, Boolean(payload.clipboard)); return; }
        message(detail || 'Inserted'); return;
      }
      if (phase === 'error') { cardOpen = false; message((detail || 'Something went wrong. Press Esc to dismiss.').slice(0, 110), 'error'); return; }
      if (phase === 'preview') { message(detail || 'Ready'); return; }
      if (phase === 'selection') show('select');
    }

    // ---------------------------------------------------------------- input: hover hit-testing + dragging
    function setHover(next) { if (next !== hovering) { hovering = next; pill.classList.toggle('hovered', next); api.setInteractive && api.setInteractive(next); } }
    document.addEventListener('mousemove', (event) => {
      if (dragging) return;
      if (!isVisible()) { setHover(false); return; }
      const r = pill.getBoundingClientRect();
      setHover(event.clientX >= r.left - 4 && event.clientX <= r.right + 4 && event.clientY >= r.top - 4 && event.clientY <= r.bottom + 4);
    });
    document.addEventListener('mouseleave', () => { if (!dragging) setHover(false); });
    pill.addEventListener('pointerdown', (event) => {
      if (event.button !== 0 || event.target.closest('button')) return;
      dragging = { x: event.screenX, y: event.screenY }; pill.setPointerCapture(event.pointerId); pill.classList.add('dragging');
    });
    pill.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      api.move && api.move(event.screenX - dragging.x, event.screenY - dragging.y);
      dragging.x = event.screenX; dragging.y = event.screenY;
    });
    const endDrag = () => { dragging = null; pill.classList.remove('dragging'); };
    pill.addEventListener('pointerup', endDrag); pill.addEventListener('pointercancel', endDrag);
    const action = (name) => () => api.action(name);
    $('primary').addEventListener('click', action('stop'));
    for (const id of ['cancel', 'selection-cancel']) $(id).addEventListener('click', action('cancel'));
    $('replace').addEventListener('click', action('replace'));
    $('enhance').addEventListener('click', action('enhance'));

    api.onState(render);
    api.onMeter && api.onMeter(onMeter);
  </script>
</body>
</html>
