<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden}
  #rim{position:fixed;inset:0;opacity:0;transition:opacity 520ms cubic-bezier(.32,.72,0,1);pointer-events:none;
    box-shadow:inset 0 0 0 1.5px rgba(30,111,255,.55),inset 0 0 46px rgba(30,111,255,.22);animation:breathe 3.4s ease-in-out infinite}
  #rim.on{opacity:1}
  @keyframes breathe{0%,100%{box-shadow:inset 0 0 0 1.5px rgba(30,111,255,.42),inset 0 0 34px rgba(30,111,255,.14)}50%{box-shadow:inset 0 0 0 1.5px rgba(30,111,255,.7),inset 0 0 58px rgba(30,111,255,.26)}}
  @media(prefers-reduced-motion:reduce){#rim{animation:none;transition-duration:1ms}}
</style></head><body><div id="rim"></div>
<script>window.__on=(v)=>{requestAnimationFrame(()=>document.getElementById("rim").classList.toggle("on",!!v))};</script></body></html>
