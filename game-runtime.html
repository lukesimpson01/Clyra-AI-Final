<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game runtime</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
      #game-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    </style>
  </head>
  <body>
    <!--
      Loaded into an iframe with sandbox="allow-scripts" and NO
      allow-same-origin, so this document runs on an opaque origin: it has no
      access to the editor's cookies, localStorage or DOM, AND the browser
      blocks every network request it tries to make at runtime. All
      communication is schema-validated JSON over a MessageChannel port.

      Because only the parse-time module graph can load, there is one
      document per engine: this one statically imports PlayCanvas (3D and voxel) and nothing
      else. See src/features/game-maker/runtime/boot.ts.
    -->
    <canvas id="game-canvas" tabindex="0"></canvas>
    <script type="module" src="/src/features/game-maker/runtime/boot3d.ts"></script>
  </body>
</html>
