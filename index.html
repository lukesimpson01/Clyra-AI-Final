<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clyra AI</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="dns-prefetch" href="https://server.arcgisonline.com" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css"
    />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      .clyra-boot-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff;
        color: #0f172a;
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      /* The instant, JS-free launch surface: a blue progress bar renders
         immediately (before React even loads) so there is never a blank flash.
         React fades it out on its first commit and hands off to the real,
         app-driven determinate bar underneath. */
      #clyra-preboot-surface {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        pointer-events: none;
      }

      .clyra-boot-track {
        width: min(280px, calc(100vw - 64px));
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(8, 120, 246, 0.14);
      }

      .clyra-boot-fill {
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #0878f6 0%, #1996ff 100%);
        animation: clyra-boot-progress 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: transform;
      }

      @keyframes clyra-boot-progress {
        from { transform: translateX(-118%); }
        to { transform: translateX(238%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .clyra-boot-fill { animation: none; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="clyra-preboot-surface" aria-hidden="true">
      <div class="clyra-boot-track">
        <div class="clyra-boot-fill"></div>
      </div>
    </div>
    <div id="root">
      <div class="clyra-boot-fallback" aria-hidden="true"></div>
    </div>
    <script>
      window.addEventListener(
        "error",
        function (event) {
          var target = event && event.target;
          var isAsset =
            target &&
            target !== window &&
            (target.tagName === "SCRIPT" || target.tagName === "LINK");

          if (!isAsset) return;

          var root = document.getElementById("root");
          // React replaces the boot fallback as soon as it mounts. Never let a
          // later, non-critical stylesheet or preload error overwrite the app.
          if (!root || !root.querySelector(":scope > .clyra-boot-fallback")) return;
          root.setAttribute(
            "data-clyra-failed-asset",
            target.src || target.href || target.getAttribute("src") || target.getAttribute("href") || "unknown",
          );

          // Vite can briefly miss a module while rebuilding a large chunk.
          // Keep the existing boot surface intact so React can still mount on
          // the next successful module request instead of replacing the app
          // with a permanent false failure screen.
        },
        true,
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
