<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Clyra Visual Scan</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a !important;
      pointer-events: none;
    }
    #backdrop {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      display: none;
      z-index: 0;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>
  <img id="backdrop" alt="" />
  <canvas id="c"></canvas>
  <script>
    /**
     * Premium screen-wide AI scan — ONE perfect expanding circle.
     * Windows may briefly glow when the front intersects them; the circle never deforms.
     */
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });
    let raf = 0;

    function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
    function smoothstep(e0, e1, x) {
      const t = clamp((x - e0) / (e1 - e0), 0, 1);
      return t * t * (3 - 2 * t);
    }
    /** Approximate cubic-bezier(0.22, 0.68, 0.28, 1.0) for t in [0,1]. */
    function easeScan(t) {
      t = clamp(t, 0, 1);
      // Gentle accel → controlled expansion → soft decelerate/fade
      if (t < 0.1) return (t / 0.1) * 0.08;
      if (t < 0.8) return 0.08 + ((t - 0.1) / 0.7) * 0.78;
      return 0.86 + ((t - 0.8) / 0.2) * 0.14;
    }
    /** Opacity along expansion (centre bright → edges near-invisible). */
    function waveOpacity(progress) {
      // progress 0→1 of radius / maxRadius
      if (progress < 0.25) return 0.8 - progress * 0.2;      // ~0.80 → 0.75
      if (progress < 0.5) return 0.75 - (progress - 0.25) * 0.6; // → ~0.60
      if (progress < 0.75) return 0.6 - (progress - 0.5) * 1.0;   // → ~0.35
      return 0.35 * (1 - smoothstep(0.75, 1.0, progress));        // → ~0.05→0
    }

    function nearestDistToRect(ox, oy, f) {
      const nx = clamp(ox, f.x, f.x + f.w);
      const ny = clamp(oy, f.y, f.y + f.h);
      // If origin inside rect, distance to nearest edge
      if (ox >= f.x && ox <= f.x + f.w && oy >= f.y && oy <= f.y + f.h) {
        return Math.min(ox - f.x, f.x + f.w - ox, oy - f.y, f.y + f.h - oy);
      }
      const dx = ox - nx, dy = oy - ny;
      return Math.hypot(dx, dy);
    }

    window.__runVisualScan = function runVisualScan(scene) {
      cancelAnimationFrame(raf);
      const backdrop = document.getElementById("backdrop");
      const hasBackdrop = Boolean(scene.backdropPath || scene.backdropDataUrl);
      if (hasBackdrop && backdrop) {
        try {
          if (scene.backdropDataUrl) {
            backdrop.src = scene.backdropDataUrl;
          } else if (scene.backdropPath && typeof require === "function") {
            const fs = require("fs");
            const buf = fs.readFileSync(scene.backdropPath);
            backdrop.src = "data:image/png;base64," + buf.toString("base64");
          }
          backdrop.style.display = "block";
          document.body.style.background = "#000";
        } catch (e) {
          console.warn("backdrop load failed", e);
          backdrop.style.display = "none";
        }
      } else if (backdrop) {
        backdrop.removeAttribute("src");
        backdrop.style.display = "none";
      }

      const dpr = Math.min(window.devicePixelRatio || scene.scale || 1, 2);
      const W = scene.width;
      const H = scene.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const reduce =
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const origin = scene.origin || { x: W / 2, y: H / 2 };
      // Furthest corner + slight overshoot so the circumference fully leaves the display
      const maxRadius =
        scene.maxRadius ||
        Math.max(
          Math.hypot(origin.x, origin.y),
          Math.hypot(W - origin.x, origin.y),
          Math.hypot(origin.x, H - origin.y),
          Math.hypot(W - origin.x, H - origin.y),
        ) * 1.06;

      // 1.5–2.2s (slightly longer on large displays)
      const diag = Math.hypot(W, H);
      const duration = reduce
        ? 280
        : scene.durationMs || clamp(Math.round(1500 + diag * 0.22), 1500, 2200);
      const ignitionMs = reduce ? 50 : 110;

      // Windows: nearest-boundary distance for brief highlight when wave touches
      const windows = [];
      const els = scene.elements || [];
      for (let i = 0; i < els.length; i++) {
        const el = els[i];
        if (!el || !el.frame) continue;
        // Prefer top-level / important surfaces only — avoid noisy tiny controls
        const role = el.role || "";
        const imp = el.importance || 0;
        if (role !== "window" && imp < 0.9) continue;
        const f = el.frame;
        if (f.w < 40 || f.h < 40) continue;
        windows.push({
          frame: f,
          radius: el.cornerRadius || 10,
          activateR: nearestDistToRect(origin.x, origin.y, f),
          hitAt: -1,
        });
      }

      const start = performance.now();
      const HIT_MS = 170;
      const VIS = hasBackdrop ? 1.15 : 1.0;

      function roundedRect(c, x, y, w, h, r) {
        const rr = Math.max(0, Math.min(r, w / 2, h / 2));
        c.beginPath();
        c.moveTo(x + rr, y);
        c.arcTo(x + w, y, x + w, y + h, rr);
        c.arcTo(x + w, y + h, x, y + h, rr);
        c.arcTo(x, y + h, x, y, rr);
        c.arcTo(x, y, x + w, y, rr);
        c.closePath();
      }

      function frame(now) {
        const elapsed = now - start;
        const t = Math.min(1, elapsed / duration);
        const eased = easeScan(t);
        const radius = Math.max(0.5, eased * maxRadius);
        const progress = radius / maxRadius;
        const op = waveOpacity(progress) * VIS;

        ctx.clearRect(0, 0, W, H);

        // ── Centre ignition (tiny soft flash → becomes the wave) ──
        if (elapsed < ignitionMs) {
          const p = elapsed / ignitionMs;
          const a = (1 - smoothstep(0.4, 1, p)) * 0.85 * VIS;
          const halo = 4 + p * 14;
          const g = ctx.createRadialGradient(origin.x, origin.y, 0, origin.x, origin.y, halo);
          g.addColorStop(0, `rgba(255,255,255,${0.9 * a})`);
          g.addColorStop(0.45, `rgba(237,246,255,${0.28 * a})`);
          g.addColorStop(1, "rgba(205,228,255,0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(origin.x, origin.y, halo, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `rgba(255,255,255,${0.95 * a})`;
          ctx.beginPath();
          ctx.arc(origin.x, origin.y, 2 + p * 1.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // ── Optional subtle screen activation just behind the front ──
        if (!reduce && elapsed > ignitionMs * 0.5 && op > 0.04) {
          const band = 18;
          const shim = ctx.createRadialGradient(
            origin.x, origin.y, Math.max(0, radius - band),
            origin.x, origin.y, radius + 2,
          );
          shim.addColorStop(0, "rgba(255,255,255,0)");
          shim.addColorStop(0.65, `rgba(255,255,255,${0.012 * VIS})`);
          shim.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = shim;
          ctx.beginPath();
          ctx.arc(origin.x, origin.y, radius + 2, 0, Math.PI * 2);
          ctx.fill();
        }

        // ── ONE perfect circle ────────────────────────────────────
        if (elapsed > ignitionMs * 0.35 && op > 0.01) {
          // Soft bloom (2–4 px) — restrained
          ctx.beginPath();
          ctx.arc(origin.x, origin.y, radius, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(218,236,255,${0.18 * op})`;
          ctx.lineWidth = 3.5;
          ctx.stroke();
          // Bright core ~1–1.5 px luminous white
          ctx.beginPath();
          ctx.arc(origin.x, origin.y, radius, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,255,255,${0.78 * op})`;
          ctx.lineWidth = 1.25;
          ctx.stroke();
        }

        // ── Window reaction: brief faint border when front intersects ──
        if (!reduce) {
          for (let i = 0; i < windows.length; i++) {
            const w = windows[i];
            const delta = radius - w.activateR;
            if (delta >= 0 && w.hitAt < 0) w.hitAt = elapsed;
            if (w.hitAt < 0) continue;
            const age = elapsed - w.hitAt;
            if (age > HIT_MS) continue;
            const fade = 1 - smoothstep(0, HIT_MS, age);
            // Peak near contact, then fade — never a permanent outline
            const peak = Math.exp(-(Math.max(0, delta) * Math.max(0, delta)) / 900);
            const a = 0.15 * fade * (0.55 + 0.45 * peak) * VIS;
            if (a < 0.02) continue;
            const f = w.frame;
            roundedRect(ctx, f.x, f.y, f.w, f.h, w.radius);
            ctx.strokeStyle = `rgba(255,255,255,${a})`;
            ctx.lineWidth = 1;
            ctx.stroke();
            roundedRect(ctx, f.x, f.y, f.w, f.h, w.radius);
            ctx.strokeStyle = `rgba(218,236,255,${a * 0.35})`;
            ctx.lineWidth = 2.5;
            ctx.stroke();
          }
        }

        if (t < 1) {
          raf = requestAnimationFrame(frame);
        } else {
          ctx.clearRect(0, 0, W, H);
          try {
            if (window.__visualScanDone) window.__visualScanDone();
          } catch (_) { /* ignore */ }
        }
      }

      raf = requestAnimationFrame(frame);
    };
  </script>
</body>
</html>
