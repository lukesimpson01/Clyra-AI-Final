<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Clyra Visual Scan</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a !important;
      pointer-events: none;
    }
    #backdrop {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      display: none;
      z-index: 0;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>
  <img id="backdrop" alt="" />
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });
    let raf = 0;

    function roundedRectPath(c, x, y, w, h, r) {
      const radius = Math.max(0, Math.min(r, w / 2, h / 2));
      c.beginPath();
      c.moveTo(x + radius, y);
      c.arcTo(x + w, y, x + w, y + h, radius);
      c.arcTo(x + w, y + h, x, y + h, radius);
      c.arcTo(x, y + h, x, y, radius);
      c.arcTo(x, y, x + w, y, radius);
      c.closePath();
    }

    function sampleRoundedRect(x, y, w, h, r, spacing) {
      const radius = Math.max(0, Math.min(r, w / 2, h / 2));
      const pts = [];
      const push = (px, py) => pts.push({ x: px, y: py });
      const step = Math.max(6, spacing);
      for (let i = radius; i <= w - radius; i += step) push(x + i, y);
      for (let a = -Math.PI / 2; a <= 0; a += 0.14) {
        push(x + w - radius + Math.cos(a) * radius, y + radius + Math.sin(a) * radius);
      }
      for (let i = radius; i <= h - radius; i += step) push(x + w, y + i);
      for (let a = 0; a <= Math.PI / 2; a += 0.14) {
        push(x + w - radius + Math.cos(a) * radius, y + h - radius + Math.sin(a) * radius);
      }
      for (let i = w - radius; i >= radius; i -= step) push(x + i, y + h);
      for (let a = Math.PI / 2; a <= Math.PI; a += 0.14) {
        push(x + radius + Math.cos(a) * radius, y + h - radius + Math.sin(a) * radius);
      }
      for (let i = h - radius; i >= radius; i -= step) push(x, y + i);
      for (let a = Math.PI; a <= (Math.PI * 3) / 2; a += 0.14) {
        push(x + radius + Math.cos(a) * radius, y + radius + Math.sin(a) * radius);
      }
      return pts;
    }

    window.__runVisualScan = function runVisualScan(scene) {
      cancelAnimationFrame(raf);
      const backdrop = document.getElementById("backdrop");
      const hasBackdrop = Boolean(scene.backdropPath || scene.backdropDataUrl);
      if (hasBackdrop && backdrop) {
        try {
          if (scene.backdropDataUrl) {
            backdrop.src = scene.backdropDataUrl;
          } else if (scene.backdropPath && typeof require === "function") {
            const fs = require("fs");
            const buf = fs.readFileSync(scene.backdropPath);
            backdrop.src = "data:image/png;base64," + buf.toString("base64");
          }
          backdrop.style.display = "block";
          document.body.style.background = "#000";
        } catch (e) {
          console.warn("backdrop load failed", e);
          backdrop.style.display = "none";
        }
      } else if (backdrop) {
        backdrop.removeAttribute("src");
        backdrop.style.display = "none";
      }

      const dpr = Math.min(window.devicePixelRatio || scene.scale || 1, 2);
      const W = scene.width;
      const H = scene.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const reduce =
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const duration = reduce ? 1000 : scene.durationMs || 1850;
      const origin = scene.origin || { x: W / 2, y: H / 2 };
      const maxRadius = scene.maxRadius || Math.hypot(W / 2, H / 2) * 1.08;

      const elements = (scene.elements || []).map((el) => {
        const f = el.frame;
        const r = el.cornerRadius || 10;
        const spacing = Math.max(8, Math.min(f.w, f.h) * 0.04);
        const samples = sampleRoundedRect(f.x, f.y, f.w, f.h, r, spacing).map((p, idx, arr) => ({
          x: p.x,
          y: p.y,
          radial: Math.hypot(p.x - origin.x, p.y - origin.y),
          pathT: arr.length > 1 ? idx / (arr.length - 1) : 0,
        }));
        const activationRadius = Math.min(...samples.map((s) => s.radial));
        return { ...el, samples, activationRadius };
      });

      const start = performance.now();
      // Wave stays subtle; UI traces carry the recognition (Linux needs stronger traces).
      const WAVE = hasBackdrop ? 0.95 : 0.8;
      const TRACE = hasBackdrop ? 2.05 : 1.7;

      function frame(now) {
        const elapsed = now - start;
        const t = Math.min(1, elapsed / duration);
        const eased = t < 0.92 ? (t / 0.92) * 0.96 : 0.96 + ((t - 0.92) / 0.08) * 0.04;
        const radius = eased * maxRadius;

        ctx.clearRect(0, 0, W, H);

        // Centre ignition
        if (elapsed < 170) {
          const p = Math.min(1, elapsed / 140);
          const core = 2.2 + p * 3.2;
          const halo = 8 + p * 18;
          const a = (1 - p * 0.72) * 0.9 * WAVE;
          const g = ctx.createRadialGradient(origin.x, origin.y, 0, origin.x, origin.y, halo);
          g.addColorStop(0, `rgba(255,255,255,${Math.min(1, 0.95 * a)})`);
          g.addColorStop(0.3, `rgba(237,246,255,${0.42 * a})`);
          g.addColorStop(0.7, `rgba(205,228,255,${0.12 * a})`);
          g.addColorStop(1, "rgba(205,228,255,0)");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(origin.x, origin.y, halo, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `rgba(255,255,255,${Math.min(1, 0.95 * a)})`;
          ctx.beginPath();
          ctx.arc(origin.x, origin.y, core, 0, Math.PI * 2);
          ctx.fill();
        }

        // Radial intelligence front — narrow, restrained (not a radar ring)
        if (!reduce && elapsed > 110) {
          const haze = ctx.createRadialGradient(
            origin.x, origin.y, Math.max(0, radius - 18),
            origin.x, origin.y, radius + 6,
          );
          haze.addColorStop(0, "rgba(255,255,255,0)");
          haze.addColorStop(0.82, `rgba(237,246,255,${0.014 * WAVE})`);
          haze.addColorStop(0.94, `rgba(255,255,255,${0.055 * WAVE})`);
          haze.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = haze;
          ctx.beginPath();
          ctx.arc(origin.x, origin.y, radius + 8, 0, Math.PI * 2);
          ctx.fill();

          // Sharp core front (~1px)
          ctx.beginPath();
          ctx.arc(origin.x, origin.y, Math.max(0.5, radius), 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,255,255,${0.18 * WAVE})`;
          ctx.lineWidth = 1.15;
          ctx.stroke();

          // Soft feather only
          ctx.beginPath();
          ctx.arc(origin.x, origin.y, Math.max(0.5, radius), 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(218,236,255,${0.07 * WAVE})`;
          ctx.lineWidth = 4;
          ctx.stroke();
        }

        // Contour traces (radial intersection)
        for (let ei = 0; ei < elements.length; ei++) {
          const el = elements[ei];
          const samples = el.samples;
          if (!samples || !samples.length) continue;

          let base = 0.42;
          const imp = el.importance || 0;
          if (imp >= 0.95) base = 0.88;
          else if (imp >= 0.78) base = 0.72;
          else if (imp >= 0.6) base = 0.58;
          else if (imp >= 0.45) base = 0.48;
          else if (imp >= 0.35) base = 0.36;

          if (el.role === "tab") base = Math.max(base, el.selected ? 0.78 : 0.62);

          ctx.save();
          ctx.lineCap = "round";
          ctx.lineJoin = "round";

          // Draw short segments with per-segment alpha (wave intersection).
          for (let i = 0; i < samples.length - 1; i++) {
            const s0 = samples[i];
            const s1 = samples[i + 1];
            const radial = (s0.radial + s1.radial) * 0.5;
            const delta = radius - radial;
            const frontSoft = 14;
            const trailStart = 4;
            const trailEnd = 220;
            const reveal = delta < -frontSoft ? 0 : delta < 0 ? (delta + frontSoft) / frontSoft : 1;
            const fade = delta <= trailStart ? 1 : Math.max(0, 1 - (delta - trailStart) / (trailEnd - trailStart));
            const contact = Math.exp(-(delta * delta) / 60);
            const alpha = Math.min(0.96, (base * reveal * fade + contact * 0.4) * TRACE);
            if (alpha < 0.04) continue;

            ctx.beginPath();
            ctx.moveTo(s0.x, s0.y);
            ctx.lineTo(s1.x, s1.y);
            // Soft bloom
            ctx.strokeStyle = `rgba(205,228,255,${0.28 * alpha})`;
            ctx.lineWidth = 5.5;
            ctx.stroke();
            // Crisp edge
            ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
            ctx.lineWidth = 1.4;
            ctx.stroke();
          }

          const delta0 = radius - el.activationRadius;
          if (delta0 > 0 && delta0 < 40) {
            const f = el.frame;
            const flash = Math.exp(-(delta0 * delta0) / 300) * base * 0.55 * TRACE;
            roundedRectPath(ctx, f.x, f.y, f.w, f.h, el.cornerRadius || 10);
            ctx.strokeStyle = `rgba(255,255,255,${Math.min(0.9, flash)})`;
            ctx.lineWidth = 1.25;
            ctx.stroke();
          }
          ctx.restore();
        }

        if (t < 1) {
          raf = requestAnimationFrame(frame);
        } else {
          ctx.clearRect(0, 0, W, H);
          try {
            if (window.__visualScanDone) window.__visualScanDone();
          } catch (_) { /* ignore */ }
        }
      }

      raf = requestAnimationFrame(frame);
    };
  </script>
</body>
</html>
